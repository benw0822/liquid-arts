<!DOCTYPE html>

                <a href="/journal.html" class="nav-link active">JOURNAL</a>

            <div style="margin-left: auto; display: flex; align-items: center; gap: 1rem;">

                <a href="/msg.html" class="nav-msg-link" aria-label="Messages" style="display: none; align-items: center; justify-content: center; width: 40px; height: 40px; color: white;">

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="explore.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"

                <path d="M6 13L17 4"></path>
                <path d="M4 15L15 6"></path>
                <path d="M4 15L6 13"></path>
                <path d="M15 6L17 4"></path>
                <path d="M11 10L8 21"></path>
                <path d="M11 10L14 21"></path>
            </svg>
            <span>EXPLORE</span>
        </a>
        <a href="bars.html" class="nav-item">

                <path d="M12 21v-8"></path>

                 <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                 <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
             </svg>
             <span>JOURNAL</span>
        </a>
        <a href="profile.html" class="nav-item">

                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>

        document.addEventListener('DOMContentLoaded', () => {
            if (window.initArticlesList) window.initArticlesList();
        });
